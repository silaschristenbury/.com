<!DOCTYPE html>

<link rel="icon" type="image/png" href="favicon.png" />

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Silas Christenbury</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Silas Christenbury – photographer, videographer, and creative based in North Carolina." />
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
   
    body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}

/* Background image layer */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("image_background.jpg") center/cover no-repeat;
  filter: blur(12px) brightness(0.6);
  z-index: -1;
}

    .wrapper {
      max-width: 720px;
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 18px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 2.4rem;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }
    h1 span {
      color: var(--accent);
    }
    .subtitle {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }
    .bio {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
      justify-content: center; /* optional: centers them horizontally */
      overflow-x: auto; /* optional: adds horizontal scroll if too many links */
}

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.18s ease;
      background: rgba(15, 23, 42, 0.85);
    }
    .link-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1120;
      font-weight: 600;
    }
    .link-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
    }
    .link-btn.primary:hover {
      filter: brightness(1.05);
    }

    /* Virtual Business Card Section */
    .vcard {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 2rem;
    }
    .vcard h2 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    .vcard p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5f5;
      margin-bottom: 1rem;
    }
    .vcard-embed {
      margin-top: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      border: 1px dashed rgba(148, 163, 184, 0.4);
      color: var(--muted);
      font-size: 0.85rem;
    }

    .footer-note {
      font-size: 0.8rem;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .wrapper { padding: 2rem 1.5rem; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <div class="tagline">Silas Christenbury</div>

    <h1>
      My Landing Page<br />
    
    </h1>

    <p class="subtitle">
       
    </p>

    <p class="bio">
      NC State Civil Engineering, Photographer, Videogropher. 
    </p>

   

    <div class="links">
      <a class="link-btn primary" href="https://sites.google.com/view/portfolio-of-silas/home" target="_blank" rel="noopener">
        Portfolio
      </a>
      <a class="link-btn primary" href="https://linkedin.com/in/silaschristenbury" target="_blank" rel="noopener">
        LinkedIn
      </a>
      <a class="link-btn primary" href="https://sefilms.com" target="_blank" rel="noopener">
        SEFILMS
      </a>
       <a class="link-btn primary" href="https://silaschristenbury.com/christenburymedia.txt" target="_blank" rel="noopener">
        Freelance Work
      </a>
      
      </a>
      <a class="link-btn primary" href="https://www.youtube.com/@silas-c" target="_blank" rel="noopener">
        Personal YouTube
      </a>
      
     
      </a>
    </div>

    <p class="footer-note">
      Page in development
    </p>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
